name: HTML5 Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.2.5

      - name: Prepare song chart assets
        run: |
          chmod +x ./prepare-html5-assets.sh
          ./prepare-html5-assets.sh

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl 9.1.0 --quiet
          haxelib install flixel 4.11.0 --quiet
          haxelib install flixel-addons 2.11.0 --quiet
          haxelib install flixel-ui 2.5.0 --quiet
          haxelib install hscript 2.5.0 --quiet
          haxelib install polymod 1.5.2 --quiet
          haxelib install newgrounds 1.4.0 --quiet
          haxelib run lime setup -y

      - name: Build HTML5
        run: haxelib run lime build html5 -release

      - name: Verify HTML5 build output
        run: |
          test -d export/release/html5/bin
          if ! grep -R -q 'doobop-hard.json' export/release/html5/bin; then
            echo "doobop-hard.json was not found in the generated HTML5 output."
            exit 1
          fi

      - name: Upload HTML5 build
        uses: actions/upload-artifact@v4
        with:
          name: html5-build
          path: export/release/html5/bin
